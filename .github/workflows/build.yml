name: Build

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub-hosted runner label
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Compile
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup toolchain install 1.74.0 --profile minimal --no-self-update
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ inputs.runner }}
      - name: Build with default features
        run: cargo +stable build --all-targets --locked
      - name: Build without default features
        run: cargo +stable build --all-targets --locked --no-default-features
      - name: Build with date support only
        run: cargo +stable build --all-targets --locked --no-default-features --features date
      - name: Build with file support only
        run: cargo +stable build --all-targets --locked --no-default-features --features file
      - name: Check minimum Rust version
        run: |
          cargo +1.74.0 check --lib --locked
          cargo +1.74.0 check --lib --locked --no-default-features
