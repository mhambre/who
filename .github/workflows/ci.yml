name: CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'benches/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/build.rs'
      - '.cargo/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'rust-toolchain*'
      - '.rustfmt.toml'
      - '.clippy.toml'
      - 'clippy.toml'
      - '.gitattributes'
      - '.gitignore'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'benches/**'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/build.rs'
      - '.cargo/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'rust-toolchain*'
      - '.rustfmt.toml'
      - '.clippy.toml'
      - 'clippy.toml'
      - '.gitattributes'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  tests:
    name: Tests (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ubuntu-latest
          - os: macOS
            runner: macos-latest
          - os: Windows
            runner: windows-latest
    uses: ./.github/workflows/test.yml
    with:
      runner: ${{ matrix.runner }}
