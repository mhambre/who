name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Check, lint, fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt --no-self-update
          rustup toolchain install 1.74.0 --profile minimal --no-self-update
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: quality
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Check feature configurations
        run: scripts/ci.sh check
      - name: Lint feature configurations
        run: scripts/ci.sh clippy
      - name: Check minimum Rust version
        run: scripts/ci.sh msrv
