[package]
name = "who"
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
authors = ["Matthew Hambrecht <hambrechtmatt@gmail.com>"]
description = "Replace your TODOs with compile-time review triggers for code whose correctness, necessity, or performance depends on things the compiler cannot verify."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mhambre/who"
readme = "README.md"
keywords = ["compile-time", "proc-macro", "correctness", "assumptions", "code-review"]
categories = ["development-tools", "development-tools::build-utils"]

[lib]
proc-macro = true

[features]
default = ["date", "file", "path"]
date = ["dep:chrono", "dep:chrono-tz"]
file = ["dep:sha2"]
path = ["dep:tempfile"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["now"], optional = true }
chrono-tz = { version = "0.10.4", optional = true }
proc-macro2 = "1"
quote = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", optional = true }
syn = "2"
tempfile = { version = "=3.10.1", optional = true }
toml = "0.5.11"

[dev-dependencies]
tempfile = "=3.10.1"
trybuild = "=1.0.80"
